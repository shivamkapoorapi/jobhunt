<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Resumify</title>
<style>
  :root{
    --paper:#EFEDE8; --ink:#12100E; --card:#FBFAF7; --red:#F0503C; --blue:#2B35D8;
    --muted:#6B6862; --faint:#8A867E; --grey:#B9B5AC; --line:#D9D5CC;
    --serif:Georgia,'Times New Roman',Times,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Mono','Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);overflow-x:hidden;
    background-image:
      repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 1px,transparent 1px 28px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 28px);
  }
  .wrap{max-width:460px;margin:0 auto;padding:56px 20px 60px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}
  .mark{width:30px;height:34px;border:1.5px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--red);flex:0 0 auto}
  .brand h1{font-family:var(--serif);font-size:29px;margin:0;font-weight:400}
  .card{
    background:var(--card);border:1px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
    padding:30px 28px;position:relative;
  }
  .card::after{content:'';position:absolute;top:0;right:0;bottom:0;width:6px;background:var(--red)}
  .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);margin:0 0 9px;
  }
  h2{font-family:var(--serif);font-size:30px;margin:0 0 8px;font-weight:400;line-height:1.15}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 24px}
  .gbtn{
    display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
    border:1px solid var(--ink);background:#fff;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
    padding:13px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--ink);
    min-height:46px;
  }
  .gbtn:hover{background:#fff}
  .gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .gbtn.off{border-color:var(--grey);color:var(--grey);box-shadow:none;cursor:not-allowed;background:transparent}
  .gicon{width:17px;height:17px;flex:0 0 auto}
  .rule{display:flex;align-items:center;gap:12px;margin:22px 0}
  .rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--line)}
  .rule span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
  label{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin:0 0 5px;
  }
  input[type=text],input[type=password]{
    width:100%;font-family:var(--mono);font-size:16px;
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px;margin-bottom:14px;
  }
  input:focus{outline:none;border-color:var(--blue)}
  .btn{
    width:100%;border:1px solid var(--ink);background:var(--blue);color:#fff;
    font-family:var(--mono);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
    padding:13px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);min-height:46px;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .btn:disabled{background:var(--grey);box-shadow:none;cursor:not-allowed}
  .msg{border:1px solid;padding:11px 13px;margin:0 0 18px;font-size:13.5px;line-height:1.5}
  .msg.err{border-color:var(--red);color:#8E2517;background:#FDF1EF}
  .msg.ok{border-color:var(--blue);color:var(--blue);background:#F0F1FE}
  .toggle{
    background:none;border:0;padding:0;margin-top:16px;color:var(--blue);cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  }
  footer{
    max-width:460px;margin:0 auto;padding:0 20px 40px;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  }
  .hide{display:none}
  @media (max-width:520px){
    .wrap{padding:34px 14px 40px}
    .card{padding:24px 20px;box-shadow:5px 5px 0 var(--ink)}
    h2{font-size:26px}
    .brand h1{font-size:25px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark"></div><h1>Resumify</h1></div>

    <div class="card">
      <p class="eyebrow">Sign in or create an account</p>
      <h2>Let&#39;s get you hired.</h2>
      <p class="sub">One account keeps your resume, your ranked matches and your
        application tracker together.</p>

      <div id="msg"></div>

      <a class="gbtn" id="gbtn" href="/auth/google">
        <svg class="gicon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-3.9H24v7.1h12.1c-.2 1.8-1.6 4.6-4.5 6.4l6.9 5.3c4.1-3.8 6.6-9.4 6.6-14.9z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.900l-7.1 5.5C7.9 40.9 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.5 27.7c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4l-7.1-5.5C2.9 16.3 2 20 2 23.3s.9 7 2.4 9.9l7.1-5.5z"/>
          <path fill="#EA4335" d="M24 9.5c4.1 0 6.9 1.8 8.5 3.3l6.1-6C34.9 3.4 29.9 1 24 1 15.4 1 7.9 6.1 4.4 13.4l7.1 5.5C13.3 13.3 18.2 9.5 24 9.5z"/>
        </svg>
        <span id="gtxt">Continue with Google</span>
      </a>

      <div class="rule"><span>or</span></div>

      <form id="localForm" autocomplete="on">
        <label for="u">Username</label>
        <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label for="p">Password</label>
        <input type="password" id="p" name="password" autocomplete="current-password">
        <button type="submit" class="btn" id="submit">Sign in</button>
      </form>

    </div>
  </div>
  <footer>Resumify &middot; Typeset in LaTeX</footer>

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function show(kind, text){
    $('msg').innerHTML = '<div class="msg ' + kind + '">' + esc(text) + '</div>';
  }

  /* Errors arrive as ?error=... from the OAuth redirect. Render as text, never
     as markup - the value round-trips through a third party. */
  var params = new URLSearchParams(location.search);
  if(params.get('error')) show('err', params.get('error'));

  fetch('/api/auth/config', {credentials:'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.user){ location.href = '/'; return; }
      if(d && !d.google){
        var b = $('gbtn');
        b.classList.add('off');
        b.removeAttribute('href');
        $('gtxt').textContent = 'Google sign-in not configured';
        b.title = 'Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to .env, then restart.';
        b.addEventListener('click', function(e){
          e.preventDefault();
          show('err', 'Google sign-in is not set up yet. Add GOOGLE_CLIENT_ID and ' +
                      'GOOGLE_CLIENT_SECRET to .env and restart the app.');
        });
      }
    })
    .catch(function(){ /* the form still works */ });

  $('localForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = $('submit');
    btn.disabled = true;
    btn.textContent = 'Checking...';
    try{
      var r = await fetch('/api/auth/local', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username: $('u').value, password: $('p').value})
      });
      var d = await r.json();
      if(d && d.ok){
        show('ok', 'Signed in. Taking you in...');
        location.href = '/';
        return;
      }
      show('err', (d && d.error) || 'Could not sign you in.');
    } catch(err){
      show('err', 'Could not reach the server. Is the app still running?');
    }
    btn.disabled = false;
    btn.textContent = 'Sign in';
  });
})();
</script>
</body>
</html>
